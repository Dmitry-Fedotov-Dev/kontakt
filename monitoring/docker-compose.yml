# Prometheus + Grafana для «Контакта».
#
#   ./scripts/run.sh                                   # кластер на этой машине
#   docker compose -f monitoring/docker-compose.yml up -d
#   Дашборд: http://localhost:3002 (без входа — только для локального использования)
#
# Сеть — хостовая: signal и media отдают /metrics только на 127.0.0.1
# (админ-порты наружу не открываются), и из моста Docker их не видно. Поэтому
# Prometheus и Grafana слушают тоже 127.0.0.1 хоста. Работает на Linux; в Docker
# Desktop (Windows, macOS) включите Settings → Resources → Network → host networking
# или запускайте из WSL.
#
# Имя проекта и порты выбраны так, чтобы стек жил рядом со стеками xk6-sip
# (9091/3001) и SAR Review (9090/3000): проекты compose различаются по имени, и
# второй проект «monitoring» забрал бы чужие контейнеры и тома.
name: kontakt-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9092
      # нагрузка xk6-sip пишет сюда свои метрики (k6 -o experimental-prometheus-rw)
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Машина под нагрузкой (CPU, память, сеть) на Linux:
  #   docker compose -f monitoring/docker-compose.yml --profile linux-host up -d
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["linux-host"]
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9101
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:11.5.2
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3002"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kontakt.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
