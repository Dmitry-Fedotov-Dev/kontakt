apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # 127.0.0.1 в сети хоста (docker-compose.yml, local.sh); prometheus — в сети Docker (Docker Desktop)
    url: http://${PROMETHEUS_HOST}:${PROMETHEUS_PORT}
    isDefault: true
    jsonData:
      timeInterval: 5s
