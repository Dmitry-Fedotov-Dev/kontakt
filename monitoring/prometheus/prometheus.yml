# Адреса — как в scripts/run.sh: signal (админ-порт) и media.
# Незапущенные цели показываются как down — между прогонами это нормально.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9092"]

  - job_name: signal
    static_configs:
      - targets: ["127.0.0.1:8091"]

  - job_name: media
    static_configs:
      - targets: ["127.0.0.1:8082"]

  - job_name: mesh
    # узлы kontakt-node: админка Master'а и Worker'ов (как в docs/MESH.md «посмотреть
    # руками»); на своей установке впишите свои адреса админок
    static_configs:
      - targets: ["127.0.0.1:7401", "127.0.0.1:7421", "127.0.0.1:7422", "127.0.0.1:7423", "127.0.0.1:7424"]

  - job_name: host
    static_configs:
      - targets: ["127.0.0.1:9101"] # профиль linux-host
