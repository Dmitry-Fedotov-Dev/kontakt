# Файлы целей перечитываются раз в 10 с: на дисках Windows (/mnt/…) и в общих папках
# Docker Desktop уведомления об изменении файлов не приходят, и новая цель ждала бы 5 минут.
# Станцию (signal, media, радио) scripts/run.sh пишет в targets/*-run-<порт>.json с портами этого
# запуска и убирает при выходе — статических адресов у них нет: иначе тревога «станция не
# отвечает» горела бы всегда, когда стенд не запущен. Prometheus подхватывает файлы сам.
global:
  scrape_interval: 5s

# Тревоги видны в Prometheus (Alerts) и в Grafana; в Telegram их шлёт cmd/notify, опрашивая
# /api/v1/alerts (Alertmanager не нужен).
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: signal
    file_sd_configs:
      - files: [/etc/prometheus/targets/signal*.json]
        refresh_interval: 10s

  - job_name: media
    file_sd_configs:
      - files: [/etc/prometheus/targets/media*.json]
        refresh_interval: 10s

  - job_name: mesh
    # узлы kontakt-node: админка Master'а и Worker'ов (как в docs/MESH.md «посмотреть
    # руками»); на своей установке впишите свои адреса админок
    static_configs:
      - targets: ["127.0.0.1:7401", "127.0.0.1:7421", "127.0.0.1:7422", "127.0.0.1:7423", "127.0.0.1:7424", "127.0.0.1:7425"]
    file_sd_configs:
      - files: [/etc/prometheus/targets/mesh*.json]
        refresh_interval: 10s

  - job_name: cloudflared
    # метрики своего туннеля (§19): сессии и соединения, а не «Мбит/с туннеля»
    file_sd_configs:
      - files: [/etc/prometheus/targets/cloudflared*.json]
        refresh_interval: 10s

  - job_name: radio
    # «Открытое радио». Цели — только из файлов: порт подбирается на месте.
    #   на этой машине:      scripts/radio.sh сам пишет targets/radio.json (и убирает при выходе);
    #   на телефоне за туннелем: monitoring/radio-target.sh https://….trycloudflare.com
    file_sd_configs:
      - files: [/etc/prometheus/targets/radio*.json]
        refresh_interval: 10s

  - job_name: host
    static_configs:
      - targets: ["127.0.0.1:9101"] # профиль linux-host
