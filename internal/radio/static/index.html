<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Открытое радио</title>
<meta name="description" content="Крути ручку — между станциями шорох. Или займи свою волну: микрофон, музыка, G.711 64 кбит/с.">
<meta name="theme-color" content="#2B1B3D">
<link rel="icon" href="data:,">
<!--OG-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #2B1B3D;
  --sky-dot: rgba(255,255,255,.06);
  --ink: #1E0F0A;
  --cream: #FFE9C2;
  --cream-lo: #E2BE86;
  --tomato: #E8573F;
  --tomato-lo: #A83424;
  --lcd: #21160B;
  --amber: #FFC24B;
  --amber-dim: #8A6224;
  --red: #FF3B2F;
  --mint: #7FE0A8;
  --focus: #FFE36E;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--sky);
  background-image: radial-gradient(var(--sky-dot) 1px, transparent 1px);
  background-size: 8px 8px;
  color: var(--cream);
  font: 400 15px/1.3 "Pixelify Sans", ui-monospace, monospace;
  -webkit-font-smoothing: none;
  /* системные полосы: в приложении (Android 15+ рисует во весь экран) отступ даёт Capacitor
     переменными --safe-area-inset-*, на iPhone — env(); в обычном браузере это 0 */
  --st: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --sb: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  padding: calc(16px + var(--st)) 16px calc(16px + var(--sb));
}
.wrap { width: min(560px, 100%); margin: 0 auto; min-height: calc(100dvh - 32px - var(--st) - var(--sb)); display: flex; flex-direction: column; }
/* Панель приёмника — внизу страницы: клавиша поддержки, главная кнопка футера («поделиться» и
   жалоба — под карточкой станции). Только на вкладке «слушать». Под ней, последней строкой на обеих
   вкладках, — правила и язык. */
.bar {
  padding-top: 22px;
  display: flex; justify-content: center;
}
.links { margin: 14px 0 0; text-align: center; font-size: 12px; color: #9C86BC; }
.links a { color: inherit; }
body:has(#rxView[hidden]) .bar { display: none; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Вкладки: слушать / вещать */
.tabs { display: flex; justify-content: center; gap: 10px; margin: 4px 0 18px; }
/* вкладки и приёмник — ближе к центру: свободное место поровну над ними и над подвалом */
.wrap > .tabs { margin-top: auto; }
.tab {
  border: 0; cursor: pointer; padding: 7px 14px 8px; font-weight: 600; letter-spacing: .04em;
  background: #4A3463; color: #C9B6E4;
  box-shadow: 0 0 0 3px var(--ink), inset -3px -3px 0 #35244A;
}
.tab.on { background: var(--amber); color: var(--ink); box-shadow: 0 0 0 3px var(--ink), inset -3px -3px 0 #C98B1E; }

/* ---------- приёмник: только радио и его ручка ---------- */
.stage { position: relative; }
#radio { width: 100%; height: auto; touch-action: none; transform-origin: 50% 100%; cursor: pointer; }
#radio.grab { cursor: grab; }
#radio.grabbing { cursor: grabbing; }
.sticker {
  margin: 14px auto 0; width: fit-content; max-width: 100%;
  padding: 6px 14px 7px; background: var(--cream); color: var(--ink);
  box-shadow: 0 0 0 3px var(--ink), 4px 4px 0 3px rgba(0,0,0,.35);
  transform: rotate(-1.5deg); text-align: center;
}
.sticker b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sticker span { display: block; font-size: 13px; color: #6B4A2A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sticker.glitch b, .sticker.glitch span { animation: tear .12s steps(1) infinite; }
@keyframes tear {
  0% { transform: translateX(0); text-shadow: 2px 0 #E0352B, -2px 0 #3BA7FF; }
  33% { transform: translateX(-3px); text-shadow: none; }
  66% { transform: translateX(2px) skewX(-8deg); text-shadow: -1px 0 #E0352B; }
}

/* ---------- ведущий ---------- */
.studio { display: grid; gap: 16px; }
.box { background: #3A2752; padding: 12px; box-shadow: 0 0 0 3px var(--ink), inset 3px 3px 0 #4E3870, inset -3px -3px 0 #2A1B3C; }

.sign-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
.sign {
  border: 0; cursor: pointer; padding: 8px 16px 9px; min-width: 190px;
  background: #3B2A2A; color: #7A5B55; text-align: center;
  box-shadow: 0 0 0 3px var(--ink), inset 3px 3px 0 #000;
}
.sign .lamp { display: block; font-weight: 600; font-size: 24px; letter-spacing: .08em; line-height: 1.1; }
.sign .freq { display: block; font-size: 13px; }
.sign.live { background: var(--red); color: #FFF3E0; animation: signblink 1.2s steps(1) infinite; }
.sign.live .lamp { text-shadow: 0 0 8px #FFD0C0; }
@keyframes signblink { 50% { background: #D22A20; } }
.arrow {
  border: 0; cursor: pointer; width: 34px; height: 34px; font-weight: 600;
  background: var(--cream); color: var(--ink); box-shadow: 0 0 0 3px var(--ink), inset -3px -3px 0 var(--cream-lo);
}
.arrow:active, .arrow.pressed { box-shadow: 0 0 0 3px var(--ink), inset 3px 3px 0 var(--cream-lo); transform: translateY(2px); }
.arrow[disabled] { opacity: .4; cursor: not-allowed; }
.name {
  display: block; width: min(260px, 100%); margin: 12px auto 0; padding: 5px 8px; border: 0; text-align: center;
  background: var(--lcd); color: var(--amber); box-shadow: 0 0 0 3px var(--ink);
}
.share { display: block; margin: 14px auto 0; }
.share[hidden] { display: none !important; }
/* жалоба — внизу и неброско: случайно не нажать, но найти можно */
.report { background: none; border: 1px solid #6B5A86; color: #9C86BC; font: inherit; font-size: 11px; padding: 3px 10px; cursor: pointer; }
.report[hidden] { display: none; }
.reportRow { text-align: center; margin-top: 12px; }
/* Лайк: пиксельное сердце рядом с «поделиться». У ведущего сердца всплывают поверх экрана. */
.rxRow { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 14px; }
.rxRow .share { margin: 0; }
.likeBtn { padding: 4px 8px 5px; line-height: 0; }
.likeBtn[hidden] { display: none !important; }
.heartImg { width: 27px; height: 24px; image-rendering: pixelated; display: inline-block; }
.likeBtn.beat .heartImg { animation: beat .25s steps(3); }
@keyframes beat { 50% { transform: scale(1.3); } }
.likeCount { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 8px; font-weight: 600; color: var(--cream); }
.likeCount[hidden] { display: none !important; }
.likeCount .heartImg { width: 18px; height: 16px; }
.likeCount.bump span { animation: beat .3s steps(3); }
.hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.hearts img {
  position: absolute; image-rendering: pixelated; width: calc(27px * var(--k)); height: calc(24px * var(--k));
  animation: rise var(--t) steps(28) forwards;
}
@keyframes rise {
  0% { transform: translate(0, 0) scale(.4); opacity: 0; }
  10% { transform: translate(0, -4vh) scale(1); opacity: 1; }
  40% { transform: translate(calc(var(--dx) * -1), -26vh); }
  70% { transform: translate(var(--dx), -46vh); opacity: .9; }
  100% { transform: translate(calc(var(--dx) * -.5), -64vh); opacity: 0; }
}
.hearts img.pop { animation-name: pop; } /* у слушателя — коротко над кнопкой */
@keyframes pop {
  0% { transform: translate(0, 0) scale(.5); opacity: 0; }
  20% { transform: translate(0, -18px) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), -90px) scale(.8); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .hearts img { animation-timing-function: steps(4); } }
.report.armed { background: #C0392B; border-color: #C0392B; color: var(--cream); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10;
  padding: 7px 14px 8px; background: var(--amber); color: var(--ink); font-weight: 600; font-size: 13px;
  box-shadow: 0 0 0 3px var(--ink), 4px 4px 0 3px rgba(0,0,0,.35); max-width: calc(100% - 32px); text-align: center;
}
.hint { text-align: center; font-size: 12px; color: #C9B6E4; margin-top: 8px; min-height: 1.3em; }
.hint.warn { color: #FF9A8A; }
.rules { text-align: center; font-size: 12px; color: #9C86BC; margin-top: 14px; }
.rules a { color: inherit; }
/* Поддержка — клавиша старого приёмника с лампочкой: утапливается со щелчком, лампа загорается. */
.donate { position: relative; }
.donate[hidden] { display: none; }
.donateBtn {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--ink);
  background: linear-gradient(#FFF6E2, var(--cream) 55%, #E6CC9C); border: 0; padding: 6px 12px 6px 9px; margin-bottom: 4px;
  box-shadow: 0 0 0 3px var(--ink), inset 0 -2px 0 #C9A86A, 0 4px 0 3px #3A2A12, 0 4px 0 6px var(--ink);
  transition: transform .07s, box-shadow .07s;
}
.donateBtn:hover { transform: translateY(-1px); }
.donateBtn:active, .donate.go .donateBtn { transform: translateY(3px); box-shadow: 0 0 0 3px var(--ink), inset 0 2px 0 #C9A86A, 0 1px 0 3px #3A2A12, 0 1px 0 6px var(--ink); }
.donate.go .donateBtn { animation: keyUp .35s .25s forwards; }
@keyframes keyUp { to { transform: none; box-shadow: 0 0 0 3px var(--ink), inset 0 -2px 0 #C9A86A, 0 4px 0 3px #3A2A12, 0 4px 0 6px var(--ink); } }
.donateBtn:focus-visible { outline: 3px solid var(--amber); outline-offset: 8px; }
.donateBtn .bulb { width: 9px; height: 9px; background: #5A3E14; box-shadow: 0 0 0 2px var(--ink); }
/* Лампа в покое медленно дышит — ярко, до полного накала; под курсором вспыхивает в такт эфиру (--lv — громкость
   из animateBody), а в тишине часто мигает. */
/* накал — насыщенный оранжевый с белым бликом (бледно-жёлтый на кремовой клавише не виден),
   и вся клавиша в такт светится янтарным ореолом на тёмном фоне */
.donateBtn .bulb { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { background: radial-gradient(circle at 35% 35%, #FFF6D0 0 25%, #FF9A1A 60%, #E25A00);
  box-shadow: 0 0 0 2px var(--ink), 0 0 10px 4px #FF9A1A, 0 0 22px 8px rgba(255, 140, 20, .55); } }
.donateBtn { animation: halo 2.4s ease-in-out infinite; }
@keyframes halo { 50% { box-shadow: 0 0 0 3px var(--ink), inset 0 -2px 0 #C9A86A, 0 4px 0 3px #3A2A12, 0 4px 0 6px var(--ink), 0 0 22px 8px rgba(255, 160, 40, .5); } }
.donateBtn:hover, .donateBtn:active, .donate.go .donateBtn { animation: none; }
.donate.hot .bulb {
  animation: none;
  background: color-mix(in srgb, #FF9A1A calc(35% + var(--lv, 0) * 65%), #5A3E14);
  box-shadow: 0 0 0 2px var(--ink), 0 0 calc(6px + var(--lv, 0) * 24px) calc(1px + var(--lv, 0) * 9px) #FF9A1A;
}
.donate.hot .donateBtn { box-shadow: 0 0 0 3px var(--ink), inset 0 -2px 0 #C9A86A, 0 4px 0 3px #3A2A12, 0 4px 0 6px var(--ink), 0 0 calc(8px + var(--lv, 0) * 20px) calc(2px + var(--lv, 0) * 8px) rgba(255, 160, 40, .55); }
.donate.hot.quiet .bulb { animation: flicker .45s steps(2) infinite; }
@keyframes flicker { 50% { background: #FF9A1A; box-shadow: 0 0 0 2px var(--ink), 0 0 16px 6px #FF9A1A; } }
.donate.go .bulb, .donate.go.hot .bulb { animation: glow 1.6s forwards; }
@keyframes glow { 0%, 60% { background: var(--amber); box-shadow: 0 0 0 2px var(--ink), 0 0 12px 3px var(--amber); } 100% { background: #5A3E14; } }
.donateMenu { /* вверх от клавиши: она внизу страницы */
  position: absolute; bottom: calc(100% + 12px); right: 0; z-index: 5; white-space: nowrap;
  display: grid; gap: 4px; background: var(--cream); padding: 6px; box-shadow: 0 0 0 3px var(--ink);
}
.bar .mid .donateMenu { right: 50%; transform: translateX(50%); }
.donateMenu[hidden] { display: none; }
.donateMenu a { color: var(--ink); text-decoration: none; padding: 6px 12px; font-size: 13px; }
.donateMenu a:hover, .donateMenu a:focus-visible { background: var(--amber); outline: none; }
@media (prefers-reduced-motion: reduce) { .donateBtn, .donateBtn .bulb, .donate.hot.quiet .bulb, .donate.go .bulb, .donate.go .donateBtn { animation: none; } }
.langSwitch { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }

.desk { display: flex; align-items: flex-end; justify-content: center; gap: 22px; flex-wrap: wrap; }
.micbtn { background: none; border: 0; padding: 0; cursor: pointer; text-align: center; color: var(--cream); }
#mic { width: 168px; height: 168px; }
.micbtn .cap { display: block; font-size: 12px; margin-top: 4px; color: #C9B6E4; }
.micbtn[aria-pressed="true"] .cap { color: var(--red); font-weight: 600; }

.mixer { display: flex; gap: 14px; align-items: flex-end; }
.mixer, .micbtn, .tabs { -webkit-user-select: none; user-select: none; }
.fader { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 44px; touch-action: none; cursor: ns-resize; }
.fader .track { position: relative; width: 14px; height: 140px; background: var(--ink); box-shadow: inset 2px 2px 0 #000; }
.fader .fill { position: absolute; left: 3px; right: 3px; bottom: 0; background: repeating-linear-gradient(0deg, var(--amber) 0 4px, transparent 4px 6px); opacity: .55; }
.fader .cap { position: absolute; left: -11px; width: 36px; height: 16px; background: var(--cream); box-shadow: 0 0 0 2px var(--ink), inset -3px -3px 0 var(--cream-lo); }
.fader .cap::after { content: ""; position: absolute; left: 6px; right: 6px; top: 7px; height: 2px; background: var(--ink); }
.fader .lbl { font-size: 11px; font-weight: 600; letter-spacing: .04em; }
.fader .val { font-size: 11px; color: #C9B6E4; }
.vu { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 22px; }
.vu .track { position: relative; width: 12px; height: 140px; background: var(--ink); box-shadow: inset 2px 2px 0 #000; }
.vu i { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 0; background: repeating-linear-gradient(0deg, var(--mint) 0 4px, transparent 4px 6px); }
.vu i.hot { background: repeating-linear-gradient(0deg, var(--red) 0 4px, transparent 4px 6px); }
.vu .lbl { font-size: 11px; font-weight: 600; }

.btn {
  border: 0; cursor: pointer; padding: 5px 10px 6px; font-size: 13px; font-weight: 600; letter-spacing: .03em;
  background: var(--cream); color: var(--ink); box-shadow: 0 0 0 3px var(--ink), inset -3px -3px 0 var(--cream-lo), inset 3px 3px 0 #FFF8E8;
}
.btn.pressed, .btn:active { box-shadow: 0 0 0 3px var(--ink), inset 3px 3px 0 var(--cream-lo); transform: translateY(2px); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qhead h2 { margin: 0; font-size: 15px; letter-spacing: .06em; color: var(--amber); }
.drop {
  margin-top: 10px; padding: 14px 10px; text-align: center; font-size: 13px; color: #C9B6E4;
  border: 3px dashed #6B5290;
}
.drop.over { border-color: var(--amber); color: var(--amber); background: rgba(255,194,75,.08); }
.search { width: 100%; margin-top: 10px; padding: 5px 8px; border: 0; background: var(--lcd); color: var(--amber); box-shadow: 0 0 0 3px var(--ink); }
.lib, .queue { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
.lib { max-height: 150px; overflow: auto; background: #2A1B3C; }
.lib li button { width: 100%; text-align: left; background: none; border: 0; padding: 4px 6px; cursor: pointer; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.lib li button:hover { background: #4A3463; }
.lib li button small { color: #9C86BC; }
.libfoot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #9C86BC; margin-top: 6px; }
.now { margin-top: 12px; background: var(--lcd); color: var(--amber); padding: 6px 8px; box-shadow: 0 0 0 3px var(--ink); }
.now .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.prog { height: 6px; margin-top: 5px; background: #000; }
.prog i { display: block; height: 100%; width: 0; background: var(--amber); }
.queue li { display: flex; gap: 6px; align-items: center; padding: 4px 2px; border-top: 1px dashed #6B5290; }
.queue li:first-child { border-top: 0; }
.queue li span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.queue li button { background: none; border: 0; color: var(--amber); cursor: pointer; padding: 0 4px; font-weight: 600; }
.queue li button[disabled] { opacity: .3; cursor: default; }
.queue .empty { color: #9C86BC; }
.foot { margin: auto 0 0; padding-top: 18px; font-size: 11px; color: #9C86BC; text-align: center; line-height: 1.4; }
.shake { animation: shake .08s steps(2) 3; }
@keyframes shake { 50% { transform: translate(2px, -1px); } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" aria-label="Режим" data-i-aria="modeAria">
    <button class="tab on" id="tabRx" aria-pressed="true" data-i="listen">LISTEN</button>
    <button class="tab" id="tabTx" aria-pressed="false" data-i="broadcast">BROADCAST</button>
  </nav>

  <!-- Приёмник: радио и ручка, больше ничего -->
  <section id="rxView">
    <div class="stage">
      <canvas id="radio" width="128" height="88" tabindex="0" role="slider"
              aria-label="Ручка настройки: крутите, чтобы переключать станции" data-i-aria="knobAria"
              aria-valuemin="87.5" aria-valuemax="108" aria-valuenow="100.0"></canvas>
    </div>
    <div class="sticker" id="sticker" aria-live="polite"><b id="st1" data-i="stickerIdle">крутни ручку</b><span id="st2">&nbsp;</span></div>
    <div class="rxRow">
      <button class="btn likeBtn" id="likeRx" hidden aria-label="Like" data-i-aria="likeAria"><img class="heartImg" alt=""></button>
      <button class="btn share" id="shareRx" hidden data-i="share">SHARE ↗</button>
    </div>
    <div class="reportRow"><button class="report" id="reportRx" hidden aria-label="Пожаловаться на станцию" data-i-aria="reportAria" data-i="report">REPORT</button></div>
  </section>

  <!-- Ведущий: табличка эфира, микрофон, три громкости, очередь -->
  <section id="txView" class="studio" hidden>
    <div class="box">
      <div class="sign-row">
        <button class="arrow" id="fDown" aria-label="Частота ниже" data-i-aria="freqDown">◀</button>
        <button class="sign" id="onair" aria-pressed="false"><span class="lamp" data-i="onAir">ON AIR</span><span class="freq" id="hostFreq">—</span></button>
        <button class="arrow" id="fUp" aria-label="Частота выше" data-i-aria="freqUp">▶</button>
      </div>
      <input class="name" id="name" maxlength="24" placeholder="название станции" autocomplete="off" aria-label="Название станции" data-i-ph="namePh" data-i-aria="nameAria">
      <div class="hint" id="hostHint">&nbsp;</div>
      <div class="likeCount" id="likeCount" hidden><img class="heartImg" alt=""><span id="likeTotal">0</span></div>
      <div class="rules" data-i-html="consentHtml">выходя в эфир, ты подтверждаешь, что тебе 18+, и принимаешь <a class="termsLink" href="terms.html" target="_blank" rel="noopener">правила</a></div>
      <button class="btn share" id="shareTx" hidden data-i="share">SHARE ↗</button>
    </div>

    <div class="box desk">
      <button class="micbtn" id="micBtn" aria-pressed="false" aria-label="Микрофон" data-i-aria="micAria">
        <canvas id="mic" width="56" height="56"></canvas>
        <span class="cap" id="micCap" data-i="micOff">MIC OFF</span>
      </button>
      <div class="mixer">
        <div class="fader" id="fMic" tabindex="0" role="slider" aria-label="Громкость микрофона" data-i-aria="fMicAria"><div class="track"><div class="fill"></div><div class="cap"></div></div><span class="lbl" data-i="fMic">MIC</span><span class="val"></span></div>

    const noise = (1 - st.strength) * 0.6 + st.scratchVis; // снег и разрывы строк в окошке
    if (noise > 0.02) {

      if (Math.random() < noise * 0.5) {

// Мультяшная «пляска» корпуса под звук и дрожь при быстром вращении.
const rxBuf = new Float32Array(512);

    const rms = Math.sqrt(e / rxBuf.length);

  const tf = `translateX(${jx.toFixed(1)}px) scale(${(1 + level * 0.025).toFixed(3)}, ${(1 - level * 0.035).toFixed(3)})`;
  if (tf !== lastTf) { R.style.transform = tf; lastTf = tf; }
  if (donateHot) { // лампа поддержки — в такт эфиру

}
const donateEl = $("donate");
let donateHot = false;
for (const [ev, on] of [["mouseenter", true], ["mouseleave", false], ["focusin", true], ["focusout", false]]) {
  donateEl.addEventListener(ev, () => { donateHot = on; donateEl.classList.toggle("hot", on); if (!on) donateEl.classList.remove("quiet"); });
}

// ---------- ручка: бесконечная, в обе стороны ----------
const TURN_MHZ = 2; // оборот — 2 МГц
function turn(rad) {
  const before = st.dial;
  st.dial = wrapF(st.dial + rad / (2 * Math.PI) * TURN_MHZ);
  st.knobAngle += rad;
  const moved = Math.abs(rad / (2 * Math.PI) * TURN_MHZ);
  if (moved) scratch(moved * 3);
  if (snap(before) !== snap(st.dial)) R.setAttribute("aria-valuenow", st.dial.toFixed(1));
  retune();
}
function scratch(a) {
  st.scratchVis = Math.min(1, st.scratchVis + a);
  if (rx) rx.port.postMessage({ scratch: a });
}
async function powerOn() {
  if (st.power) return;
  await ensureAudio();
  st.power = true;
  rx.port.postMessage({ vol: 0.8, s: st.strength, d: st.dist });
  scratch(0.6);
  retune();
}
function toLocal(e) { const r = R.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 128, (e.clientY - r.top) / r.height * 88]; }
const onKnob = (x, y) => Math.hypot(x - KX, y - KY) < KR + 5;
let dragA = null;
R.addEventListener("pointerdown", e => {
  powerOn(); // первое касание — это и включение: браузер даёт звук только после жеста
  const [x, y] = toLocal(e);
  if (!onKnob(x, y)) return;
  R.setPointerCapture(e.pointerId);
  dragA = Math.atan2(y - KY, x - KX);
  R.classList.add("grabbing");
});
R.addEventListener("pointermove", e => {
  const [x, y] = toLocal(e);
  if (dragA === null) { R.classList.toggle("grab", onKnob(x, y)); return; }
  const a = Math.atan2(y - KY, x - KX);
  let d = a - dragA;
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  dragA = a;
  turn(d);
});
const endDrag = () => { dragA = null; R.classList.remove("grabbing"); };
R.addEventListener("pointerup", endDrag);
R.addEventListener("pointercancel", endDrag);
R.addEventListener("wheel", e => { e.preventDefault(); powerOn(); turn((e.deltaY > 0 ? -1 : 1) * 0.05 / TURN_MHZ * 2 * Math.PI); }, { passive: false });
R.addEventListener("keydown", e => {
  const step = (e.shiftKey ? 1 : 0.1) / TURN_MHZ * 2 * Math.PI;
  if (["ArrowRight", "ArrowUp"].includes(e.key)) { e.preventDefault(); powerOn(); turn(step); }
  if (["ArrowLeft", "ArrowDown"].includes(e.key)) { e.preventDefault(); powerOn(); turn(-step); }

// Наклейка под радио: что играет. Не список — только то, на что настроена ручка.
const sticker = $("sticker");
function setSticker(a, b, glitch) {

  const b2 = b || " ";

}
function drawSticker() {
  if (performance.now() < errUntil) return setSticker(TXT.noSound, errText);
  if (!st.power) {
    if (shared) return setSticker(shared.name || TXT.freq(shared.f), TXT.sharedSticker(shared.track));
    return setSticker(TXT.stickerIdle, "");
  }
  const { s, d } = nearest(st.dial);

  else setSticker(TXT.static, "");
}

// ---------- вкладки ----------
function setMode(m) {
  if (st.mode === m) return;
  st.mode = m;
  const tx = m === "tx";
  $("tabRx").classList.toggle("on", !tx); $("tabTx").classList.toggle("on", tx);
  $("tabRx").setAttribute("aria-pressed", String(!tx)); $("tabTx").setAttribute("aria-pressed", String(tx));
  $("rxView").hidden = tx; $("txView").hidden = !tx;
  if (rx) rx.port.postMessage({ vol: !tx && st.power ? 0.8 : 0, flush: true });
  if (tx && !st.onAir && (!st.hostFreq || taken(st.hostFreq))) st.hostFreq = pickFree();
  retune();

}
$("tabRx").onclick = () => setMode("rx");
$("tabTx").onclick = () => setMode("tx");

// ---------- ведущий ----------
const taken = f => st.stations.some(s => s.f === f);
function pickFree() { // случайная волна подальше от чужих — чтобы не делить эфир с соседом
  for (let i = 0; i < 200; i++) {
    const f = 876 + (Math.random() * 204 | 0);
    if (!st.stations.some(s => Math.abs(s.f - f) < 6)) return f;
  }
  for (let f = 875; f <= 1080; f++) if (!taken(f)) return f;
  return 1000;
}
const fmt = f => (f / 10).toFixed(1);
function hostHint(msg, warn) { const h = $("hostHint"); h.textContent = msg || " "; h.classList.toggle("warn", !!warn); }
let hintHold = 0, slowWarnUntil = 0;

function renderHost() {
  holdScreen(st.onAir);
  $("hostFreq").textContent = (st.hostFreq ? fmt(st.hostFreq) : "—") + " " + TXT.mhz;
  $("fDown").disabled = $("fUp").disabled = st.onAir;
  $("onair").classList.toggle("live", st.onAir);
  $("onair").setAttribute("aria-pressed", String(st.onAir));
  if (performance.now() < hintHold) return;
  if (connecting) return hostHint(TXT.connecting);
  if (reconnecting) return hostHint(TXT.reconnecting, true);
  if (ctx && ctx.state !== "running" && (st.onAir || current)) return hostHint(TXT.suspended, true);
  if (st.onAir && performance.now() - lastTxAt > 3000) return hostHint(TXT.noTx, true);
  // Тишина в эфире не выглядит как ошибка — поэтому о ней говорим прямо.
  if (st.onAir) {
    const me = st.stations.find(s => s.f === st.hostFreq);
    if (vol.air === 0) hostHint(TXT.airZeroOn, true);
    else if (!nowTitle()) hostHint(TXT.silence + (me ? TXT.listening(st.hostListeners) : ""), true);
    else hostHint(TXT.onAirHint + (me ? TXT.listening(st.hostListeners) : "") + " · " + nowTitle());
  } else if (taken(st.hostFreq)) hostHint(TXT.waveTaken, true);
  else if (vol.air === 0) hostHint(TXT.airZeroOff, true);
  else hostHint(TXT.waveFree);
}
function stepFreq(d) {
  if (st.onAir) return;

  if (f < 875) f = 1080;
  st.hostFreq = f;

}
$("fDown").onclick = () => stepFreq(-1);
$("fUp").onclick = () => stepFreq(1);

// Смеситель: микрофон и музыка → громкость эфира → полоса телефона → компрессор → 8 кГц кадры.
let tx = null, hws = null, micSrc = null, micOn = false, micAn = null;
const vol = { mic: 0.7, music: 0.7, air: 0.8 };
async function ensureTx() {
  await ensureAudio();
  if (tx) return tx;
  const mix = ctx.createGain();
  mix.channelCount = 1; mix.channelCountMode = "explicit"; mix.channelInterpretation = "speakers"; // в эфир — моно
  const air = ctx.createGain();

  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3400; lp.Q.value = 0.7; // выше 4 кГц G.711 не передаст

  const sink = ctx.createGain(); sink.gain.value = 0; // ворклет должен быть подключён к выходу, иначе браузер его не крутит
  mix.connect(air).connect(hp).connect(lp).connect(comp).connect(node).connect(sink).connect(ctx.destination);
  const music = ctx.createGain(); music.connect(mix);
  const monitor = ctx.createGain(); monitor.connect(ctx.destination); // ведущий слышит свою музыку
  const mic = ctx.createGain(); mic.gain.value = 0; mic.connect(mix);  // микрофон в монитор не идёт: иначе свист
  micAn = ctx.createAnalyser(); micAn.fftSize = 512; mic.connect(micAn);

    const { f, p } = e.data;

    // Неотправленного больше секунды — связь ведущего с сервером тормозит (часто мобильный
    // интернет): слушатели слышат обрывы, а пачка опоздавших кадров потом отбрасывается.
    if (hws && hws.bufferedAmount > 8000 && performance.now() > slowWarnUntil) {

}
function applyGains() {
  if (!tx) return;
  const t = ctx.currentTime;
  tx.mic.gain.setTargetAtTime(micOn ? vol.mic * 1.6 : 0, t, 0.02);
  tx.music.gain.setTargetAtTime(vol.music * 1.2 * (micOn ? 0.3 : 1), t, 0.15); // под голос музыка приглушается
  tx.monitor.gain.setTargetAtTime(vol.music * 0.8, t, 0.05);
  tx.air.gain.setTargetAtTime(vol.air * 1.25, t, 0.05);
}
let vuPeak = 0;
function vu(p) {
  vuPeak = Math.max(p, vuPeak * 0.85);
  const m = $("vu");
  m.style.height = "calc(" + Math.min(100, vuPeak * 140) + "% - 4px)";
  m.classList.toggle("hot", vuPeak > 0.8);
}

// Фейдеры: вертикальные, тянуть мышью/пальцем, колесо, стрелки.
function fader(id, key) {
  const el = $(id), track = el.querySelector(".track"), cap = el.querySelector(".cap"), fill = el.querySelector(".fill"), val = el.querySelector(".val");
  const show = () => {
    const v = vol[key];
    cap.style.bottom = "calc(" + v * 100 + "% - " + v * 16 + "px)";
    fill.style.height = v * 100 + "%";
    val.textContent = Math.round(v * 100);
    el.setAttribute("aria-valuenow", String(Math.round(v * 100)));
  };
  const set = v => { vol[key] = Math.round(Math.max(0, Math.min(1, v)) * 100) / 100; show(); applyGains(); renderHost(); };
  const fromY = e => { const r = track.getBoundingClientRect(); set(1 - (e.clientY - r.top) / r.height); };
  let drag = false;
  el.addEventListener("pointerdown", e => { drag = true; el.setPointerCapture(e.pointerId); fromY(e); });
  el.addEventListener("pointermove", e => { if (drag) fromY(e); });
  el.addEventListener("pointerup", () => { drag = false; });
  el.addEventListener("pointercancel", () => { drag = false; });
  el.addEventListener("wheel", e => { e.preventDefault(); set(vol[key] + (e.deltaY > 0 ? -0.05 : 0.05)); }, { passive: false });
  el.addEventListener("keydown", e => {
    if (["ArrowUp", "ArrowRight"].includes(e.key)) { e.preventDefault(); set(vol[key] + 0.05); }
    if (["ArrowDown", "ArrowLeft"].includes(e.key)) { e.preventDefault(); set(vol[key] - 0.05); }
  });
  el.setAttribute("aria-valuemin", "0"); el.setAttribute("aria-valuemax", "100");
  show();
}
fader("fMic", "mic"); fader("fMusic", "music"); fader("fAir", "air");

// Микрофон — большой, пиксельный, нажимается целиком.
const micC = $("mic"), mg = micC.getContext("2d");
const micBuf = new Float32Array(512);
let micLevel = 0;
function drawMic() {
  if (micAn && micOn) {
    micAn.getFloatTimeDomainData(micBuf);
    let e = 0; for (const v of micBuf) e += v * v;
    const t = Math.min(1, Math.sqrt(e / micBuf.length) * 4);
    micLevel += (t - micLevel) * (t > micLevel ? 0.6 : 0.12);
  } else micLevel *= 0.8;
  mg.clearRect(0, 0, 56, 56);
  const cx = 28;
  // звуковые волны по бокам — сколько, зависит от громкости голоса
  if (micOn) for (let k = 0; k < 3; k++) {
    if (micLevel < k * 0.18 + 0.03) break;
    const r = 15 + k * 4;
    mg.fillStyle = k === 0 ? P.red : k === 1 ? P.amber : P.yellow;
    for (let deg = -35; deg <= 35; deg += 7) {
      const a = deg * Math.PI / 180;
      mg.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(14 + Math.sin(a) * r), 1, 2);
      mg.fillRect(Math.round(cx - Math.cos(a) * r), Math.round(14 + Math.sin(a) * r), 1, 2);
    }
  }
  // дужка и стойка
  mg.fillStyle = P.ink;
  mg.fillRect(cx - 13, 14, 3, 16); mg.fillRect(cx + 10, 14, 3, 16); mg.fillRect(cx - 13, 28, 26, 3);
  mg.fillRect(cx - 2, 30, 4, 16);
  rrect(mg, cx - 12, 45, 24, 8, 2, P.ink); rrect(mg, cx - 10, 47, 20, 4, 1, "#7C7489");
  // капсула с сеткой
  rrect(mg, cx - 9, 1, 18, 28, 8, P.ink);
  rrect(mg, cx - 7, 3, 14, 24, 6, micOn ? "#FFB1A6" : "#C9C4D4");
  mg.fillStyle = micOn ? "#D9544A" : "#8E879E";
  for (let y = 5; y < 26; y += 2) for (let x = cx - 6; x <= cx + 6; x += 2) if (((x + y) & 3) === 0) mg.fillRect(x, y, 1, 1);
  mg.fillStyle = P.ink; mg.fillRect(cx - 8, 16, 16, 3);           // поясок
  mg.fillStyle = micOn && (tick >> 4) & 1 ? P.red : "#5A3A3A"; mg.fillRect(cx - 1, 17, 2, 1); // огонёк
}
$("micBtn").onclick = async () => {
  await ensureTx();
  if (!micSrc) {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (_) { hintHold = performance.now() + 3000; hostHint(TXT.noMic, true); return; }
    micSrc = ctx.createMediaStreamSource(stream);
    micSrc.connect(tx.mic);
  }
  micOn = !micOn;
  applyGains();
  $("micBtn").setAttribute("aria-pressed", String(micOn));
  $("micCap").textContent = micOn ? TXT.micOn : TXT.micOff;
  sendTitle(); renderHost();
};

// wantAir — ведущий хочет быть в эфире. Пока это так, оборванное соединение восстанавливается
// само: сервер перезапускают при обновлении, и эфир не должен из-за этого кончаться.
let wantAir = false, reconnecting = false, retries = 0;
$("onair").onclick = async () => {
  if (wantAir) { // OFF AIR
    wantAir = false; reconnecting = false;
    if (hws) hws.close(); else { st.onAir = false; $("name").disabled = false; renderHost(); }
    return;
  }
  if (connecting) return;
  if (me.banned) { shake($("onair")); showError(BANNED_TEXT); return; }
  if (taken(st.hostFreq)) { shake($("onair")); hintHold = performance.now() + 2500; hostHint(TXT.waveTakenBy(st.hostFreq), true); return; }
  connecting = true; hintHold = 0; renderHost(); // табличка отвечает сразу, а не после запуска звука
  try { await ensureTx(); } catch (_) { connecting = false; return; } // причина уже на экране
  connecting = false;
  wantAir = true; retries = 0;
  connectHost();
};
function connectHost() {
  lastTxAt = performance.now();
  let opened = false;
  const ws = new WebSocket(wsURL("/ws/host?f=" + st.hostFreq + "&name=" + encodeURIComponent($("name").value.trim())));
  hws = ws;
  ws.onopen = () => {
    opened = true; retries = 0; reconnecting = false; st.onAir = true; $("name").disabled = true;
    $("likeCount").hidden = true; // у нового эфира свой счёт
    sendTitle(); renderHost();
  };
  ws.onmessage = e => {
    if (typeof e.data !== "string") return;
    try {
      const m = JSON.parse(e.data);
      if (m.card === "yellow") showError(TXT.yellowCard);
      if (typeof m.listeners === "number") { st.hostListeners = m.listeners; renderHost(); }
      if (typeof m.likes === "number") gotLikes(m.likes, m.total);
    } catch (_) {}
  };
  ws.onclose = e => {
    if (hws === ws) hws = null;
    if (e.code === 4003) { // модерация: эфир закрыт, переподключаться незачем
      me.banned = true;
      wantAir = false; reconnecting = false; st.onAir = false; $("name").disabled = false;
      showError(BANNED_TEXT); renderHost();
      return;
    }
    if (wantAir && (opened || reconnecting) && retries < 30) { // связь была и оборвалась — возвращаемся
      reconnecting = true; retries++;
      renderHost();
      setTimeout(() => { if (wantAir && !hws) connectHost(); }, Math.min(500 * retries, 5000));
      return;
    }
    const wasReconnecting = reconnecting;
    wantAir = false; reconnecting = false; st.onAir = false; $("name").disabled = false;
    if (!opened) {
      shake($("onair"));
      showError(wasReconnecting ? TXT.backFail : TXT.refused(e.code));
    }
    renderHost();
  };
}
function shake(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

// ---------- очередь ----------
const queue = [];   // {file, name}
let current = null, playing = false;
let library = [];   // найденное в выбранной папке: {file, name, path}

const isMp3 = f => /\.mp3$/i.test(f.name) || f.type === "audio/mpeg";
const trackName = f => f.name.replace(/\.[^.]+$/, "");
function enqueue(files) {
  let n = 0;
  for (const f of files) if (isMp3(f)) { queue.push({ file: f, name: trackName(f) }); n++; }
  renderQueue();
  if (n && !current) next();
  return n;
}
function nowTitle() {
  const track = current && playing ? current.name : "";
  return micOn ? (track ? TXT.fMic + " · " + track : TXT.fMic) : track;
}
function sendTitle() { if (hws && hws.readyState === 1) hws.send(JSON.stringify({ title: nowTitle() })); }

function renderQueue() {
  const list = $("queue");
  list.textContent = "";
  if (!queue.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = TXT.queueEmpty; list.append(li); }
  queue.forEach((q, i) => {
    const li = document.createElement("li");
    const n = document.createElement("span"); n.textContent = (i + 1) + ". " + q.name; n.title = q.name;
    const up = document.createElement("button"); up.textContent = "▲"; up.setAttribute("aria-label", TXT.up); up.disabled = i === 0;
    up.onclick = () => { [queue[i - 1], queue[i]] = [queue[i], queue[i - 1]]; renderQueue(); };
    const rm = document.createElement("button"); rm.textContent = "✕"; rm.setAttribute("aria-label", TXT.remove);
    rm.onclick = () => { queue.splice(i, 1); renderQueue(); };
    li.append(n, up, rm);
    list.append(li);
  });
  $("now").textContent = current ? (playing ? "▶ " : "❚❚ ") + current.name : TXT.silenceNow;
  $("play").textContent = playing ? TXT.pause : TXT.play;
}
function stopCurrent() {
  if (!current) return;
  current.el.pause();
  current.src.disconnect();
  URL.revokeObjectURL(current.el.src);
  current = null;
}
async function next() {
  await ensureTx();
  stopCurrent();
  const q = queue.shift();
  if (!q) { playing = false; renderQueue(); sendTitle(); renderHost(); return; }
  // <audio> читает mp3 потоком: весь файл в память не декодируется — так дешевле
  const el = new Audio(URL.createObjectURL(q.file));
  const src = ctx.createMediaElementSource(el);
  src.connect(tx.music); src.connect(tx.monitor);
  el.onended = () => next();
  el.onerror = () => { hintHold = performance.now() + 2500; hostHint(TXT.unreadable(q.name), true); next(); };
  current = { name: q.name, el, src };
  playing = true;
  try { await el.play(); } catch (_) { playing = false; } // браузер не дал автозапуск — ждём PLAY
  renderQueue(); sendTitle(); renderHost();
}
$("play").onclick = async () => {
  await ensureTx();
  if (!current) return next();
  if (playing) { current.el.pause(); playing = false; }
  else { await current.el.play(); playing = true; }
  renderQueue(); sendTitle(); renderHost();
};
$("skip").onclick = () => next();

$("addFiles").onclick = () => $("files").click();
$("addDir").onclick = () => $("dir").click();
$("files").onchange = e => { enqueue(e.target.files); e.target.value = ""; };
// Папка не уходит в очередь целиком: из неё получается библиотека, по которой ищут.
$("dir").onchange = e => {
  setLibrary([...e.target.files].filter(isMp3).map(f => ({ file: f, name: trackName(f), path: f.webkitRelativePath || f.name })));
  e.target.value = "";
};
function setLibrary(items) {
  library = items.sort((a, b) => a.path.localeCompare(b.path));
  $("libBox").hidden = false;
  $("search").value = "";
  renderLib();
  $("search").focus();
}
// Поиск — простым вхождением подстроки, без регулярных выражений: точка или скобка в запросе ничего не ломают.
function matches() {
  const q = $("search").value.trim().toLowerCase();
  return q ? library.filter(t => t.path.toLowerCase().includes(q)) : library;
}
function renderLib() {
  const found = matches(), ol = $("lib");
  ol.textContent = "";
  for (const t of found.slice(0, 100)) {
    const li = document.createElement("li"), b = document.createElement("button");
    b.append(t.name);
    const dir = t.path.includes("/") ? t.path.slice(0, t.path.lastIndexOf("/")) : "";
    if (dir) { const s = document.createElement("small"); s.textContent = "  " + dir; b.append(s); }
    b.title = TXT.toQueue(t.path);
    b.onclick = () => { enqueue([t.file]); };
    li.append(b); ol.append(li);
  }
  $("libCount").textContent = library.length
    ? TXT.found(found.length, library.length)
    : TXT.noMp3;
  $("libAll").disabled = !found.length;
}
$("search").oninput = renderLib;
$("libAll").onclick = () => enqueue(matches().map(t => t.file));

// Перетаскивание: файлы — сразу в очередь, папка — в библиотеку для поиска.
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove("over")));
drop.addEventListener("drop", async e => {
  e.preventDefault();
  const entries = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.some(en => en.isDirectory)) {
    const found = [];
    await Promise.all(entries.map(en => walk(en, "", found)));
    setLibrary(found);
  } else enqueue(e.dataTransfer.files);
});
function walk(entry, prefix, out) {
  if (entry.isFile) return new Promise(res => entry.file(f => { if (isMp3(f)) out.push({ file: f, name: trackName(f), path: prefix + f.name }); res(); }, () => res()));
  return new Promise(res => {
    const reader = entry.createReader(), all = [];
    const read = () => reader.readEntries(async batch => { // отдаёт порциями — читаем до пустой
      if (batch.length) { all.push(...batch); read(); return; }
      await Promise.all(all.map(en => walk(en, prefix + entry.name + "/", out)));
      res();
    }, () => res());
    read();
  });
}

// ---------- кнопки на секунду вдавлены ----------
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".btn, .arrow");
  if (!b || b.disabled) return;
  b.classList.add("pressed");
  clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.remove("pressed"), 1000);
});

function frame() {
  if (st.mode === "rx") {
    updateSignal();
    animateBody();
    drawRadio();
    drawSticker();
  } else {
    drawMic();
    if (current) { const d = current.el.duration; $("prog").style.width = d ? (current.el.currentTime / d * 100) + "%" : "0"; }
    else $("prog").style.width = "0";
  }
  requestAnimationFrame(frame);
}

// ---------- поделиться волной ----------
// Ссылка /w/101.7?n=станция&t=трек: трек — тот, что играл в момент нажатия. Карточку с картинкой
// для Telegram и других мессенджеров сервер собирает по этой же ссылке.
function shareURL(f, name, track) {
  const q = new URLSearchParams();
  if (name) q.set("n", name);
  if (track) q.set("t", track);
  if (LANG === "en") q.set("l", "en"); // карточка ссылки — на языке того, кто делится
  const qs = q.toString();
  return location.origin + BASE + "/w/" + fmt(f) + (qs ? "?" + qs : "");
}
// Короткая ссылка /r/код берётся у сервера заранее — как только станция поймана или трек сменился:
// iPhone не откроет меню «Поделиться», если перед этим ждать ответа сети. Нет кода — длинная ссылка.
const shortCache = new Map(); // «f, станция, трек» → ссылка; "" — запрос идёт или не удался
function shortFor(f, name, track) {
  const key = f + "\n" + name + "\n" + track;
  if (shortCache.has(key)) return shortCache.get(key);
  shortCache.set(key, "");
  fetch(BASE + "/api/short", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ f, n: name, t: track, l: LANG }) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { if (/^https?:\/\//.test(j.url || "")) shortCache.set(key, j.url); })
    .catch(() => { /* остаётся длинная ссылка */ });
  return "";
}
let toastT = null;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); }
  el.textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => el.remove(), 2500);
}
async function share(f, name, track) {
  const url = shortFor(f, name, track) || shareURL(f, name, track);
  const title = (name || TXT.freq(f)) + " · " + TXT.title;
  const text = TXT.shareText(f, track);
  if (navigator.share) { // телефон: системное меню — Telegram, WhatsApp…
    try { await navigator.share({ title, text, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; /* иначе — копируем ссылку ниже */ }
  }
  try { await navigator.clipboard.writeText(url); toast(TXT.copied); }
  catch (_) { window.prompt(TXT.copyPrompt, url); } // буфер обмена недоступен (http, старый браузер)
}
$("shareRx").onclick = () => {
  const { s, d } = nearest(st.dial);
  if (s && d < CATCH) share(s.f, s.n, s.t || "");
};
$("shareTx").onclick = () => share(st.hostFreq, $("name").value.trim(), nowTitle());
setInterval(() => {
  const { s, d } = nearest(st.dial);
  $("shareRx").hidden = !(st.power && s && d < CATCH);
  if (st.power) mediaSession(s && d < CATCH ? s : null);
  // тип «микрофон» у сервиса — только когда микрофон и правда включён: без разрешения Android 14+
  // запрещает его и роняет приложение (эфир с одной музыкой разрешения не просит)
  if (st.onAir) appAir(($("name").value.trim() || TXT.title) + " · " + TXT.freq(st.hostFreq), TXT.onAirHint, micOn);
  else if (st.power) appAir(s && d < CATCH ? s.n : TXT.betweenStations, s && d < CATCH ? TXT.freq(s.f) + (s.t ? " · " + s.t : "") : TXT.title, false);
  else appAir("", "", false);
  $("reportRx").hidden = $("shareRx").hidden || !me.moderation;
  $("likeRx").hidden = $("shareRx").hidden;
  $("shareTx").hidden = !st.onAir;
  if (!$("shareRx").hidden) shortFor(s.f, s.n, s.t || "");
  if (st.onAir) shortFor(st.hostFreq, $("name").value.trim(), nowTitle());
}, 300);

// ---------- лайки ----------
// Слушатель жмёт сердце — сервер копит лайки и раз в 250 мс шлёт ведущему {"likes":N,"total":T};
// у ведущего сердца всплывают поверх экрана. Чаще раза в 300 мс от слушателя сервер не считает —
// так же ограничена и кнопка.
const HEART = (() => { // 9 × 8: обводка, заливка, блик
  const rows = [".kk...kk.", "krrk.krrk", "krwrrrrrk", "krrrrrrrk", ".krrrrrk.", "..krrrk..", "...krk...", "....k...."];
  const c = document.createElement("canvas"); c.width = 9; c.height = 8;
  const g = c.getContext("2d"), col = { k: "#1E0F0A", r: "#E8433A", w: "#FFB3A6" };
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (col[ch]) { g.fillStyle = col[ch]; g.fillRect(x, y, 1, 1); } }));
  return c.toDataURL();
})();
document.querySelectorAll(".heartImg").forEach(i => { i.src = HEART; });
$("likeCount").title = TXT.likesTitle;
function floatHeart(x, y, k, t, pop) { // одно сердце от точки x,y вверх, k — масштаб, t — секунды
  const box = $("hearts");
  if (box.childElementCount > 60) return; // ливень лайков — лишние не рисуем
  const i = document.createElement("img");
  i.src = HEART; i.alt = ""; if (pop) i.className = "pop";
  i.style.left = (x - 13.5 * k) + "px"; i.style.top = (y - 12 * k) + "px";
  i.style.setProperty("--k", k); i.style.setProperty("--t", t + "s");
  i.style.setProperty("--dx", pop ? ((Math.random() * 2 - 1) * 14).toFixed(0) + "px" : ((Math.random() * 2 - 1) * 5).toFixed(1) + "vw");
  i.addEventListener("animationend", () => i.remove());
  box.append(i);
}
let likeAt = 0;
$("likeRx").onclick = () => {
  const now = performance.now();
  if (now - likeAt < 300) return;
  likeAt = now;
  const b = $("likeRx"), r = b.getBoundingClientRect();
  b.classList.remove("beat"); void b.offsetWidth; b.classList.add("beat");
  floatHeart(r.left + r.width / 2, r.top, 0.8, 0.9, true);
  if (lws && lws.readyState === 1) lws.send(JSON.stringify({ like: true }));
};
function gotLikes(n, total) { // ведущему: n новых — сердца снизу экрана, счётчик за эфир
  for (let i = 0; i < Math.min(n, 12); i++) {
    setTimeout(() => floatHeart(window.innerWidth * (0.15 + Math.random() * 0.7), window.innerHeight - 20,
      1 + Math.random() * 0.8, 2.4 + Math.random() * 1.2), i * 90);
  }
  const c = $("likeCount");
  c.hidden = false; $("likeTotal").textContent = total;
  c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
}

// ---------- жалоба на станцию ----------
// Модерация общая с рулеткой: на станцию жалуются слушатели, бан закрывает эфир (слушать можно).
let me = { moderation: false, banned: false, cards: 0 };
fetch(BASE + "/api/me", { cache: "no-store" }).then(r => r.json()).then(m => { me = m; }).catch(() => {});
const BANNED_TEXT = TXT.banned;
let reportArm = null;
$("reportRx").onclick = () => {
  const b = $("reportRx");
  if (!b.classList.contains("armed")) { // второе нажатие в течение 3 с — жалоба
    b.classList.add("armed"); b.textContent = TXT.sure;
    clearTimeout(reportArm);
    reportArm = setTimeout(() => { b.classList.remove("armed"); b.textContent = TXT.report; }, 3000);
    return;
  }
  clearTimeout(reportArm);
  b.classList.remove("armed"); b.textContent = TXT.report;
  if (lws && lws.readyState === 1) lws.send(JSON.stringify({ report: true }));
  else toast(TXT.noConn);
};

// Открыли по ссылке на волну: стрелка сразу стоит на ней, звук — после первого касания.
let shared = null;
{
  const m = HERE.pathname.slice(BASE.length).match(/^\/w\/(\d{2,3}(?:\.\d)?)$/);
  const f = m ? Math.round(parseFloat(m[1]) * 10) : 0;
  if (f >= 875 && f <= 1080) {
    const q = new URLSearchParams(HERE.search);
    shared = { f, name: (q.get("n") || "").slice(0, 24), track: (q.get("t") || "").slice(0, 64) };
    st.dial = f / 10;
    R.setAttribute("aria-valuenow", st.dial.toFixed(1));
  }
}
$("sticker").addEventListener("pointerdown", () => powerOn());
st.knobAngle = (st.dial - MIN) / TURN_MHZ * 2 * Math.PI;
setInterval(() => { if (st.mode === "tx") renderHost(); }, 1000);
renderQueue();
connectListen();
requestAnimationFrame(frame);
