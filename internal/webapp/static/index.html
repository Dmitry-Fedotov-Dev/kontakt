<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Контакт</title>
<meta name="description" content="Снимите трубку — и говорите со случайным человеком. Только голос, звук старой линии.">
<meta name="theme-color" content="#D5DBD6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --wall: #D5DBD6;
  --wall-line: rgba(0,0,0,.035);
  --cream: #F3E9D2;
  --cream-dim: #E0CFAE;
  --bake: #A3201C;
  --bake-deep: #6B100D;
  --ink: #2A0806;
  --lamp: #E2B23A;
  --green: #8FD16A;
  --focus: #FFE36E;
}
@media (prefers-color-scheme: dark) {
  :root { --wall: #1D2321; --wall-line: rgba(255,255,255,.025); }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--wall);
  background-image: repeating-linear-gradient(0deg, transparent 0 3px, var(--wall-line) 3px 4px);
  font: 400 15px/1.3 "Pixelify Sans", ui-monospace, monospace;
  color: var(--cream);
  display: grid; place-items: center; align-content: center; gap: 10px;
  min-height: 100dvh; padding: 12px;
  -webkit-font-smoothing: none;
}

/* Сцена 74 × 92 «пикселя» (--u — один пиксель сцены): корпус 15–59 стоит по центру (поле справа
   пустое, под трубку слева). Стальной корпус — он и
   есть интерфейс: табличка, экран, жетоны, кнопки. Слева на рычаге висит трубка 14 × 40, шнур петлёй
   уходит в корпус; снял трубку — она снята с рычага, положил — вернулась. */
.scene {
  position: relative;
  width: var(--sw);
  aspect-ratio: 74 / 92;
  container-type: size;
  --u: calc(100cqw / 74);
}
/* с кнопкой поддержки под сценой — ещё 3.4em, иначе строка ссылок уходит за край экрана */
/* ширина сцены — меньшее из «во весь экран» и «во всю высоту»; высоту даёт пропорция. Высоту с
   max-width задавать нельзя: упрёмся в край — пропорция ломается, и пиксели сцены плывут. */
body { --h: min(calc(100dvh - 24px - 2.2em), 860px); --sw: min(calc(100vw - 24px), calc(var(--h) * 74 / 92)); }
body:has(#donate:not([hidden])) { --h: min(calc(100dvh - 24px - 5.6em - 10px), 860px); }
@supports not (aspect-ratio: 1) { .scene { width: 420px; height: 644px; } }
.scene > canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.u { position: absolute; }
.handset {
  left: 0; top: calc(var(--u) * 14); width: calc(var(--u) * 14); height: calc(var(--u) * 40); z-index: 2;
  transform-origin: 85% 8%; transition: transform .32s steps(4);
}
.handset canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.handset.lifted { transform: translateY(calc(var(--u) * -6)) rotate(4deg); }
.handset.ring { animation: ring .09s steps(2) 6; }
.handset.lifted.ring { animation: ringUp .09s steps(2) 6; }
@keyframes ring { 50% { transform: rotate(2deg) translateX(1px); } }
@keyframes ringUp { 0%, 100% { transform: translateY(calc(var(--u) * -6)) rotate(4deg); } 50% { transform: translateY(calc(var(--u) * -6)) rotate(7deg); } }

/* Лицевая панель корпуса: колонка 18–56, всё по сетке сцены */
.panel {
  left: calc(var(--u) * 18.5); width: calc(var(--u) * 37.5); top: 0; height: 100%;
  font-size: clamp(10.5px, calc(var(--u) * 1.95), 17px);
  text-align: center;
}
.panel > * { position: absolute; left: 0; right: 0; margin: 0; }
.brand {
  top: calc(var(--u) * 3); height: calc(var(--u) * 7); display: grid; place-items: center;
  font-weight: 600; font-size: calc(var(--u) * 3.3); line-height: 1; letter-spacing: .05em;
  color: #262B30; text-shadow: 0 calc(var(--u) * .3) 0 #F2F6F7;
}
.lcd {
  background: #1B2014; color: var(--green);
  border: .25em solid #14181B; box-shadow: inset 0 0 0 .2em #2E3624;
  padding: .55em .5em .5em; top: calc(var(--u) * 12); height: calc(var(--u) * 16.5); overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; gap: .25em;
  image-rendering: pixelated;
}
.lcd .state { font-weight: 600; font-size: 1.12em; display: flex; align-items: center; justify-content: center; gap: .45em; }
.lcd .sub { color: #B9E39C; font-size: .9em; min-height: 1.3em; }
.lamp { width: .62em; height: .62em; background: #39421F; flex: none; }
.lamp.on { background: var(--lamp); }
.lamp.blink { animation: blink 1s steps(1) infinite; }
.lamp.red { background: #FF5A3C; }
@keyframes blink { 50% { background: #39421F; } }

/* Круглые пиксельные кнопки: картинка — спрайт 24×24, нарисованный на canvas (выпуклый и
   вдавленный); подпись под ней. По нажатию на 1 с ставится вдавленный спрайт. */
.rbtn {
  font: inherit; font-weight: 600; color: var(--cream); background: none; border: 0; padding: 0;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .15em;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.rbtn img { width: 4.4em; height: 4.4em; image-rendering: pixelated; display: block; }
.rbtn span { font-size: 1em; letter-spacing: .04em; text-shadow: 0 .09em 0 var(--bake-deep); }
.rbtn:disabled { opacity: .45; cursor: not-allowed; }
.rbtn:focus-visible { outline: .2em solid var(--focus); outline-offset: .1em; }
.actions { top: calc(var(--u) * 56); bottom: calc(var(--u) * 6); display: grid; gap: .6em; justify-items: center; align-content: center; }
.scene:not(.entry) .actions { top: calc(var(--u) * 44); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2em; justify-items: center; }

.online { font-size: .8em; color: var(--cream-dim); margin: 0; text-shadow: 0 1px 0 #1B1F22; }
.gate { top: calc(var(--u) * 44); display: flex; flex-direction: column; gap: .45em; text-align: left; color: var(--cream); }
.gate p { margin: 0; font-size: .92em; }
.check { display: flex; gap: .5em; align-items: flex-start; cursor: pointer; font-size: .9em; }
.check input { width: 1.1em; height: 1.1em; margin: .1em 0 0; flex: none; accent-color: var(--lamp); }
.gate a, .foot a { color: var(--cream); }
.foot { font-size: .8em; color: var(--cream-dim); margin: 0; text-align: center; }
/* Жетоны: щель монетоприёмника, окошко со стопкой, табло отсчёта. Ряд — по сетке сцены (30–42). */
.tokens { top: calc(var(--u) * 30); height: calc(var(--u) * 12.5); }
.tokens > * { position: absolute; }
.slotPlate {
  left: 0; top: 0; width: calc(var(--u) * 7); height: calc(var(--u) * 7.5); background: #B8C2C7;
  box-shadow: inset var(--u) var(--u) 0 #E1E8EB, inset calc(var(--u) * -1) calc(var(--u) * -1) 0 #7D878C, 0 0 0 calc(var(--u) * .6) #14181B;
}
.slotPlate i { position: absolute; display: block; }
.slotHole { left: calc(var(--u) * 2.5); top: calc(var(--u) * 1.5); width: calc(var(--u) * 2); height: calc(var(--u) * 3.5); background: #0B0E10; box-shadow: inset calc(var(--u) * -.5) 0 0 #3A4146; }
.plateLamp { left: calc(var(--u) * 2.5); top: calc(var(--u) * 5.6); width: calc(var(--u) * 2); height: var(--u); background: #3E6B2A; }
.scene.has .plateLamp { background: #8FD16A; box-shadow: 0 0 calc(var(--u) * .8) #8FD16A; }
.scene.empty .plateLamp { background: #FF5A3C; box-shadow: 0 0 var(--u) #FF5A3C; animation: blink 1s steps(1) infinite; }
.scene.nudge .slotPlate, .scene.nudge .tube { animation: nudge .3s steps(3); }
@keyframes nudge { 33% { transform: translateX(calc(var(--u) * -.6)); } 66% { transform: translateX(calc(var(--u) * .6)); } }
.tube {
  left: calc(var(--u) * 9); top: calc(var(--u) * .7); width: calc(var(--u) * 28.5); height: calc(var(--u) * 9); overflow: hidden;
  background: #18232A; box-shadow: inset var(--u) 0 0 #2E4652, 0 0 0 calc(var(--u) * .6) #14181B, 0 0 0 calc(var(--u) * 1.1) #7D878C;
}
.tube img, .flyToken { position: absolute; width: calc(var(--u) * 7); height: calc(var(--u) * 7); image-rendering: pixelated; }
.tube img { top: var(--u); }
.flyToken { z-index: 3; pointer-events: none; }
.tokensLabel {
  left: calc(var(--u) * 9); width: calc(var(--u) * 28.5); top: calc(var(--u) * 10.7);
  font-weight: 600; font-size: calc(var(--u) * 1.5); line-height: 1; letter-spacing: .12em;
  color: #E1E8EB; text-shadow: 0 calc(var(--u) * .25) 0 #14181B;
}
.tokenWait {
  left: 0; width: calc(var(--u) * 7); top: calc(var(--u) * 8.4); height: calc(var(--u) * 3.8);
  background: #2A1A08; box-shadow: 0 0 0 calc(var(--u) * .6) #14181B, inset 0 0 0 calc(var(--u) * .4) #3A260C;
  font-weight: 600; font-size: calc(var(--u) * 1.8); line-height: calc(var(--u) * 3.8); color: #FFB648;
  text-shadow: 0 0 calc(var(--u) * .6) rgba(255, 182, 72, .55); letter-spacing: .04em;
}
.tokenWait.full { color: #6B4A1C; text-shadow: none; }
.tokens[hidden] { display: none; }
/* Поддержка — монетка таксофона: при наведении поблёскивает, по нажатию падает в щель со звоном. */
.donate { display: grid; justify-items: center; gap: 6px; position: relative; }
.donate[hidden] { display: none; }
.donateBtn {
  display: flex; align-items: center; gap: .55em; cursor: pointer;
  font: 600 1.05em/1 "Pixelify Sans", ui-monospace, monospace; color: var(--cream); letter-spacing: .04em;
  background: var(--bake); border: 0; padding: .45em 1em .45em .5em;
  box-shadow: 0 0 0 .18em var(--ink), inset -.2em -.2em 0 var(--bake-deep), inset .2em .2em 0 #C9443A, 0 .3em 0 .18em var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.donateBtn span { text-shadow: 0 .09em 0 var(--bake-deep); }
.donateBtn:hover { transform: translateY(-.08em); }
.donateBtn:active { transform: translateY(.22em); box-shadow: 0 0 0 .18em var(--ink), inset .2em .2em 0 var(--bake-deep), 0 .08em 0 .18em var(--ink); }
.donateBtn:focus-visible { outline: .2em solid var(--focus); outline-offset: .35em; }
.slot { width: 2.1em; height: 2.1em; position: relative; overflow: hidden; display: grid; place-items: center; }
.slot::after { content: ""; position: absolute; left: .15em; right: .15em; bottom: .05em; height: .22em; background: var(--ink); } /* щель */
.coin { width: 1.7em; height: 1.7em; image-rendering: pixelated; display: block; }
.donateBtn:hover .coin { animation: spin 1s steps(8) infinite; }
@keyframes spin { 0%, 100% { transform: scaleX(1); } 25% { transform: scaleX(.35); } 50% { transform: scaleX(-1); } 75% { transform: scaleX(-.35); } }
.donate.go .coin { animation: drop 1.3s steps(14); }
/* подпрыгнула, упала в щель, следующая съехала сверху на её место */
@keyframes drop { 0% { transform: translateY(0); } 12% { transform: translateY(-.35em); } 40% { transform: translateY(2.2em); }
  41%, 70% { transform: translateY(-2.2em); } 100% { transform: translateY(0); } }
.donateMenu { /* над кнопкой, поверх трубки: снизу на телефоне её не видно без прокрутки */
  position: absolute; bottom: calc(100% + .6em); left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 2;
  display: grid; gap: 4px; background: var(--cream); padding: 6px;
  box-shadow: 0 0 0 .18em var(--ink), 0 .3em 0 .18em var(--ink);
}
.donateMenu[hidden] { display: none; }
.donateMenu a { color: var(--ink); text-decoration: none; padding: .35em .7em; font-size: .95em; }
.donateMenu a:hover, .donateMenu a:focus-visible { background: var(--lamp); outline: none; }
@media (prefers-reduced-motion: reduce) { .donateBtn:hover .coin, .donate.go .coin { animation: none; } }
.foot .lang { font: inherit; color: var(--cream); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce) {
  .handset.ring, .handset.lifted.ring { animation: none; }
  .handset { transition: none; }
  .scene.empty .plateLamp, .scene.nudge .slotPlate, .scene.nudge .tube { animation: none; }
  .lamp.blink { animation: none; }
}
</style>
</head>
<body>
<main class="scene" id="scene">
  <canvas id="booth" width="74" height="92" aria-hidden="true"></canvas>
  <div class="u handset" id="handset"><canvas id="art" width="14" height="40" aria-hidden="true"></canvas></div>

  <section class="u panel">
    <h1 class="brand" data-i="brand">Контакт</h1>

    <!-- вход: правила и выбор линии -->
    <form class="gate" id="gate" hidden>
      <label class="check"><input type="checkbox" id="c-age"> <span data-i="age">Мне есть 18 лет</span></label>
      <label class="check"><input type="checkbox" id="c-terms"> <span data-i-html="acceptHtml">Принимаю <a href="terms.html" target="_blank" rel="noopener">правила</a> и сам(а) отвечаю за свои слова</span></label>
    </form>

    <!-- жетоны: щель, окошко со стопкой, табло отсчёта до следующего -->
    <div class="tokens" id="tokens" hidden>
      <div class="slotPlate" aria-hidden="true"><i class="slotHole"></i><i class="plateLamp"></i></div>
      <div class="tube" id="tube" role="img" aria-label=""></div>
      <div class="tokensLabel" aria-hidden="true" data-i="tokensLabel">ЖЕТОНЫ</div>
      <div class="tokenWait" id="tokenWait" aria-hidden="true"></div>
      <img class="flyToken" id="flyToken" alt="" hidden>
    </div>

    <div class="lcd" id="lcd" role="status" aria-live="polite">
      <div class="state"><span class="lamp" id="lamp"></span><span id="state" data-i="idle">Трубка лежит</span></div>
      <div class="sub" id="sub"></div>
    </div>

    <div class="actions">
      <button class="rbtn" id="main-btn" type="button" aria-label="pick up" data-i-aria="pickUp"><img alt=""><span data-i="pickUp">pick up</span></button>
      <div class="row2" id="call-btns" hidden>
        <button class="rbtn" id="report-btn" type="button" aria-label="ban" data-i-aria="ban"><img alt=""><span data-i="ban">ban</span></button>
        <button class="rbtn" id="hangup-btn" type="button" aria-label="bye" data-i-aria="bye"><img alt=""><span data-i="bye">bye</span></button>
      </div>
      <p class="online" id="online">&nbsp;</p>
    </div>
  </section>
</main>
<!-- под трубкой: внутри у панели фиксированная высота, и строка там обрезалась -->
<div class="donate" id="donate" hidden>
  <button type="button" class="donateBtn" aria-haspopup="true" aria-expanded="false"><span class="slot"><canvas class="coin" id="coin" width="13" height="13"></canvas></span><span data-i="support">support</span></button>
  <div class="donateMenu" hidden></div>
</div>
<p class="foot"><a class="termsLink" href="terms.html" target="_blank" rel="noopener" data-i="rules">rules</a> · <button type="button" class="lang" id="lang" data-i="other">English</button></p>

<script>
"use strict";
// ================= таксофон =================
// Корпус 60 × 92: сталь, свет сверху-слева; табличка (3–9), утопленная панель кнопок, лоток внизу,
// рычаг слева (на нём висит трубка) и шнур из трубки в корпус. Экран, жетоны и кнопки — разметка
// поверх, по той же сетке. lifted — трубка снята: шнур тянется к её новому месту.
const BOOTH = { out: "#14181B", base: "#59636B", hi: "#76828A", hi2: "#8E9AA1", lo: "#444C52", lo2: "#343A3F",
  chr: "#B8C2C7", chrHi: "#E1E8EB", chrLo: "#7D878C", hole: "#0B0E10", panel: "#4E575E" };
function drawBooth(lifted) {
  const g = document.getElementById("booth").getContext("2d"), C = BOOTH;
  g.clearRect(0, 0, 74, 92);
  const px = (x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };
  const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  const x0 = 15, x1 = 59, y0 = 1, y1 = 90; // корпус, углы срезаны на 2
  for (let y = y0; y <= y1; y++) {
    const cut = y - y0 < 2 ? 2 - (y - y0) : y1 - y < 2 ? 2 - (y1 - y) : 0;
    for (let x = x0 + cut; x <= x1 - cut; x++) {
      let c = C.base;
      if (x === x0 + cut || x === x1 - cut || y === y0 || y === y1) c = C.out;
      else if (y === y0 + 1 || x === x0 + cut + 1) c = C.hi2;
      else if (y === y0 + 2 || x === x0 + cut + 2) c = C.hi;
      else if (x === x1 - cut - 1 || y === y1 - 1) c = C.lo2;
      else if (x === x1 - cut - 2 || y === y1 - 2) c = C.lo;
      px(x, y, c);
    }
  }
  for (const [x, y] of [[18, 4], [55, 4], [18, 86], [55, 86]]) { px(x, y, C.chrHi); px(x + 1, y + 1, C.lo2); } // заклёпки
  // табличка: хром с фаской
  rect(20, 3, 35, 7, C.out); rect(21, 4, 33, 5, C.chr); rect(21, 4, 33, 1, C.chrHi); rect(21, 4, 1, 5, C.chrHi);
  rect(53, 4, 1, 5, C.chrLo); rect(21, 8, 33, 1, C.chrLo);
  // утопленная панель под экраном, жетонами и кнопками
  rect(17, 11, 41, 72, C.lo2); rect(18, 12, 39, 70, C.panel); rect(18, 81, 39, 1, C.hi); rect(56, 12, 1, 70, C.hi);
  // лоток возврата
  rect(30, 84, 15, 5, C.out); rect(31, 85, 13, 3, C.hole); rect(31, 84, 13, 1, C.chrLo); rect(30, 88, 15, 1, C.chr);
  // рычаг: хромовая скоба, на ней висит трубка
  rect(11, 16, 5, 3, C.out); rect(12, 17, 4, 1, C.chr); px(12, 16, C.chrHi);
  // шнур звеньями: из низа трубки в левый бок корпуса, петлёй вниз
  const a = lifted ? [5, 48] : [7, 54], d = [15, 76]; // низ трубки: висит / снята
  const b = [a[0] - 2, a[1] + 16], c = [d[0] - 9, d[1] + 10];
  let prev = null;
  for (let t = 0, i = 0; t <= 1.0001; t += 0.01, i++) {
    const q = 1 - t;
    const x = Math.round(q * q * q * a[0] + 3 * q * q * t * b[0] + 3 * q * t * t * c[0] + t * t * t * d[0]);
    const y = Math.round(q * q * q * a[1] + 3 * q * q * t * b[1] + 3 * q * t * t * c[1] + t * t * t * d[1]);
    if (prev && prev[0] === x && prev[1] === y) continue;
    prev = [x, y];
    px(x, y, (x + y) % 3 === 0 ? C.chrHi : (x + y) % 3 === 1 ? C.chr : C.chrLo);
  }
  rect(14, 75, 2, 3, C.chr); px(14, 75, C.chrHi); // втулка шнура
}
// Трубка 14 × 40 — та же красная, что была во весь экран, только висит на рычаге.
(function drawHandset() {
  const W = 14, H = 40, g = document.getElementById("art").getContext("2d");
  const C = { out: "#2A0806", base: "#A3201C", hi: "#CF3A2E", hi2: "#E2614F", lo: "#7E1512", lo2: "#5C0D0A", hole: "#2A0806" };
  function span(y) {
    const cup = (y0, y1, x0, x1, rTop, rBot) => {
      const top = y - y0 < rTop, r = top ? rTop : rBot, dy = top ? y - y0 : y1 - y;
      const cut = dy < r ? Math.round(r - Math.sqrt(r * r - (r - dy) * (r - dy))) : 0;
      return [x0 + cut, x1 - cut];
    };
    if (y <= 8) return cup(0, 8, 0, 13, 3, 1);        // ушная чашка
    if (y <= 10) return y === 9 ? [1, 12] : [2, 11]; // шейка
    if (y <= 29) return [3, 10];                     // ручка
    if (y <= 31) return y === 30 ? [2, 11] : [1, 12];
    return cup(32, 39, 0, 13, 1, 3);                 // микрофонная чашка
  }
  for (let y = 0; y < H; y++) {
    const [l, r] = span(y), [pl, pr] = y > 0 ? span(y - 1) : [99, -1], [nl, nr] = y < H - 1 ? span(y + 1) : [99, -1];
    for (let x = l; x <= r; x++) {
      const edge = x === l || x === r || x < pl || x > pr || x < nl || x > nr;
      const t = (x - l) / Math.max(1, r - l);

    a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = l.label;
    a.addEventListener("click", () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); });
    return a;
  }));
  root.hidden = false;
  btn.addEventListener("click", () => {
    sound();
    root.classList.remove("go"); void root.offsetWidth; root.classList.add("go"); // анимация с начала
    if (urls.length === 1) { window.open(urls[0].url, "_blank", "noopener"); return; }
    menu.hidden = !menu.hidden;
    btn.setAttribute("aria-expanded", String(!menu.hidden));
  });
  document.addEventListener("click", e => {
    if (!menu.hidden && !root.contains(e.target)) { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); }
  });
}

// Монетка 13 × 13: латунь с тёмным ободком и бликом сверху-слева, на ней сердце.
(function drawCoin() {
  const g = $("coin").getContext("2d");
  const heart = ["..hh.hh..", ".hhhhhhh.", ".hhhhhhh.", "..hhhhh..", "...hhh...", "....h...."];
  for (let y = 0; y < 13; y++) for (let x = 0; x < 13; x++) {
    const d = Math.hypot(x - 6, y - 6);
    if (d > 6.4) continue;
    const h = heart[y - 4] && heart[y - 4][x - 2] === "h";
    g.fillStyle = d > 5.3 ? "#6E4A0E" : h ? "#A3201C" : (x + y < 8 && d > 3.2) ? "#FFF0B0" : "#E2B23A";
    g.fillRect(x, y, 1, 1);
  }
})();
function clink() { // монетка звякнула и упала в щель
  const c = sfxCtx(); if (!c) return;
  const t = c.currentTime;
  ping(c, t + 0.20, 2637, 0.25, 0.08); ping(c, t + 0.20, 3951, 0.18, 0.05);
  ping(c, t + 0.31, 2093, 0.30, 0.06);
}

async function loadState() {
  try { cfg = Object.assign(cfg, await (await fetch("api/config", { cache: "no-store" })).json()); } catch {}
  // в России — своя ссылка первой: зарубежные карты там не работают
  const donate = [{ url: cfg.donate_url, label: T.anyCard }, { url: cfg.donate_ru_url, label: T.ruCard }];
  setupDonate($("donate"), LANG === "ru" ? donate.reverse() : donate, clink);
  try { me = await (await fetch("api/me", { cache: "no-store" })).json(); setTokens(me, false); } catch {}
  if (me.banned) return showBanned();
  if (cfg.maintenance) return setIdle("bad", T.maint, T.maintHint);
  setIdle();
  if (me.cards > 0) sub.textContent = T.yellowSub;
}

async function pollStats() {
  try {
    const s = await (await fetch("api/stats", { cache: "no-store" })).json();
    $("online").textContent = s.online ? T.online(s.online, s.talking) : T.nobody;
  } catch {}
}

// ================= аудио =================
const SEG_END = [0x1F, 0x3F, 0x7F, 0xFF, 0x1FF, 0x3FF, 0x7FF, 0xFFF];
const ALAW_ENC = new Uint8Array(8192);
for (let i = 0; i < 8192; i++) {
  let s = i - 4096, mask = 0xD5;
  if (s < 0) { mask = 0x55; s = -s - 1; }
  let seg = 0; while (seg < 8 && s > SEG_END[seg]) seg++;
  ALAW_ENC[i] = seg >= 8 ? 0x7F ^ mask : ((seg << 4) | (seg < 2 ? (s >> 1) & 0xF : (s >> seg) & 0xF)) ^ mask;
}
const ALAW_DEC = new Float32Array(256);
for (let i = 0; i < 256; i++) {
  const a = i ^ 0x55; let t = (a & 0x0F) << 4; const seg = (a & 0x70) >> 4;
  if (seg === 0) t += 8; else if (seg === 1) t += 0x108; else { t += 0x108; t <<= seg - 1; }
  ALAW_DEC[i] = ((a & 0x80) ? t : -t) / 32768;
}

const WORKLET = `
class Capture extends AudioWorkletProcessor {
  constructor() { super(); this.step = sampleRate / 8000; this.pos = 0; this.l1 = 0; this.l2 = 0;
    this.a = 1 - Math.exp(-2 * Math.PI * 3400 / sampleRate); this.buf = new Int16Array(160); this.n = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0]; if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.l1 += this.a * (ch[i] - this.l1); this.l2 += this.a * (this.l1 - this.l2);
      if (++this.pos >= this.step) { this.pos -= this.step;
        this.buf[this.n++] = Math.max(-1, Math.min(1, this.l2 * 1.6)) * 32767;
        if (this.n === 160) { this.port.postMessage(this.buf.buffer, [this.buf.buffer]); this.buf = new Int16Array(160); this.n = 0; }
      }
    }
    return true;
  }
}
class Player extends AudioWorkletProcessor {
  constructor() { super();
    this.ring = new Float32Array(16000); this.w = 0; this.r = 0; this.fill = 0; this.frac = 0; this.on = false;
    this.step = 8000 / sampleRate;
    this.port.onmessage = e => {
      if (e.data.flush) { this.fill = 0; this.r = this.w; this.on = false; return; }
      const p = e.data.pcm, n = this.ring.length;
      for (let i = 0; i < p.length; i++) { this.ring[this.w] = p[i]; this.w = (this.w + 1) % n; }
      this.fill = Math.min(this.fill + p.length, n);
      if (this.fill > 4000) { this.r = (this.r + this.fill - 800) % n; this.fill = 800; } // не копим задержку
    };
  }
  process(_, outputs) {
    const out = outputs[0][0], n = this.ring.length;
    for (let i = 0; i < out.length; i++) {
      if (!this.on && this.fill >= 480) this.on = true;   // джиттер-буфер 60 мс
      let v = 0;
      if (this.on) {
        if (this.fill < 2) this.on = false;
        else {
          const a = this.ring[this.r], b = this.ring[(this.r + 1) % n];
          v = a + (b - a) * this.frac; this.frac += this.step;
          while (this.frac >= 1) { this.frac -= 1; this.r = (this.r + 1) % n; this.fill--; }
        }
      }
      out[i] = v;
    }
    return true;
  }
}
registerProcessor("k-capture", Capture);
registerProcessor("k-player", Player);`;

let ctx, mic, capture, player;
async function startAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
    player = new AudioWorkletNode(ctx, "k-player", { numberOfInputs: 0, outputChannelCount: [1] });
    player.connect(ctx.destination);
  }
  await ctx.resume();
  mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  const src = ctx.createMediaStreamSource(mic);
  capture = new AudioWorkletNode(ctx, "k-capture", { outputChannelCount: [1] });
  const mute = ctx.createGain(); mute.gain.value = 0;
  src.connect(capture); capture.connect(mute); mute.connect(ctx.destination);
  capture.port.onmessage = e => sendRTP(new Int16Array(e.data));
}
function stopAudio() {
  if (mic) mic.getTracks().forEach(t => t.stop());
  if (capture) { capture.port.onmessage = null; capture.disconnect(); }
  mic = capture = null;
  if (player) player.port.postMessage({ flush: true });
}

// ================= RTP (бинарные кадры по медиа-WebSocket) =================
let mediaWS = null, rtpSeq = 0, rtpTs = 0, rtpSsrc = 0, marker = true;
function sendRTP(pcm) {
  // голос уходит только в разговоре; пока ищем — слышим станцию, но молчим
  if (call.state !== "talking" || !mediaWS || mediaWS.readyState !== 1 || mediaWS.bufferedAmount > 16000) return;
  const p = new Uint8Array(12 + pcm.length), dv = new DataView(p.buffer);
  p[0] = 0x80; p[1] = 8 | (marker ? 0x80 : 0); marker = false;
  dv.setUint16(2, rtpSeq); dv.setUint32(4, rtpTs); dv.setUint32(8, rtpSsrc);
  rtpSeq = (rtpSeq + 1) & 0xFFFF; rtpTs = (rtpTs + pcm.length) >>> 0;
  for (let i = 0; i < pcm.length; i++) p[12 + i] = ALAW_ENC[(pcm[i] >> 3) + 4096];
  mediaWS.send(p);
}
function onRTP(buf) {
  const p = new Uint8Array(buf);
  if (p.length < 12 || (p[0] >> 6) !== 2 || (p[1] & 0x7F) !== 8) return;
  let off = 12 + 4 * (p[0] & 0x0F);
  if (p[0] & 0x10) off += 4 + 4 * ((p[off + 2] << 8) | p[off + 3]);
  const out = new Float32Array(p.length - off);
  for (let i = off; i < p.length; i++) out[i - off] = ALAW_DEC[p[i]];
  player.port.postMessage({ pcm: out }, [out.buffer]);
}

// ================= SIP поверх WebSocket =================
const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, "0")).join("");
const host = rnd(5) + ".invalid";
const call = { state: "idle" };
let ws = null, pending = {}, talkStart = 0, talkTimer = 0, lastTalkEnd = 0;

const build = (first, headers, body = "") =>
  first + "\r\n" + headers.map(h => h + "\r\n").join("") + `Content-Length: ${new TextEncoder().encode(body).length}\r\n\r\n` + body;

function parse(text) {
  const i = text.indexOf("\r\n\r\n"), head = i < 0 ? text : text.slice(0, i), body = i < 0 ? "" : text.slice(i + 4);
  const lines = head.split("\r\n"), h = {}, short = { v: "via", f: "from", t: "to", i: "call-id", m: "contact" };
  for (const l of lines.slice(1)) {
    const c = l.indexOf(":"); if (c < 0) continue;
    let k = l.slice(0, c).trim().toLowerCase(); k = short[k] || k;
    (h[k] = h[k] || []).push(l.slice(c + 1).trim());
  }
  const m = /^SIP\/2\.0 (\d+)/.exec(lines[0]);
  return { status: m ? +m[1] : 0, method: m ? "" : lines[0].split(" ")[0], h, body };
}
const reasonText = m => (/text="([^"]*)"/.exec((m.h.reason || [""])[0]) || [])[1] || "";

function hdrs(method, cseq, toTag) {
  return [`Via: SIP/2.0/WSS ${host};branch=z9hG4bK${rnd(8)}`, "Max-Forwards: 70",
    `From: <sip:anon@${host}>;tag=${call.fromTag}`, `To: <${call.ruri}>${toTag ? ";tag=" + toTag : ""}`,
    `Call-ID: ${call.id}`, `CSeq: ${cseq} ${method}`];
}
function sendRaw(s) { if (ws && ws.readyState === 1) ws.send(s); }
function sendInfo(obj) {
  const cseq = ++call.cseq;
  return new Promise(res => {
    pending[cseq] = res;
    sendRaw(build(`INFO ${call.ruri} SIP/2.0`, [...hdrs("INFO", cseq, call.toTag), "Content-Type: application/json"], JSON.stringify(obj)));
    setTimeout(() => { if (pending[cseq]) { delete pending[cseq]; res(null); } }, 4000);
  });
}
function reply200(m) {
  sendRaw(build("SIP/2.0 200 OK", [...m.h.via.map(v => "Via: " + v), "From: " + m.h.from[0], "To: " + m.h.to[0],
    "Call-ID: " + m.h["call-id"][0], "CSeq: " + m.h.cseq[0]]));
}

function onSIP(text) {
  const m = parse(text);
  if (m.status) {
    const [cseqNum, method] = (m.h.cseq || ["0 X"])[0].split(" ");
    if (method === "INFO" && pending[cseqNum]) { const r = pending[cseqNum]; delete pending[cseqNum]; try { r(JSON.parse(m.body)); } catch { r(null); } return; }
    if (method !== "INVITE" || m.status < 200) return;
    if (m.status === 200) {
      call.toTag = (/;tag=([^;>\s]+)/.exec(m.h.to[0]) || [])[1];
      sendRaw(build(`ACK ${call.ruri} SIP/2.0`, hdrs("ACK", 1, call.toTag)));
      const path = (/a=x-kontakt-media:ws (\S+)/.exec(m.body) || [])[1];
      if (path) openMedia(path);
      return;
    }
    const why = reasonText(m);
    sendRaw(build(`ACK ${call.ruri} SIP/2.0`, hdrs("ACK", 1, (/;tag=([^;>\s]+)/.exec(m.h.to[0]) || [])[1])));
    teardown(false);
    if (why === "banned") return showBanned();
    if (why === "no-tokens") { denied(); return refreshTokens(false).then(() => setIdle()); }
    if (m.status === 503 && why === "maintenance") return setIdle("bad", T.maint, T.maintHint);
    return setIdle("bad", T.noAnswer, T.retry);
  }
  if (m.method === "INFO") {
    reply200(m);
    let st = {}; try { st = JSON.parse(m.body); } catch {}
    onStation(st.state, st.reason);
  } else if (m.method === "BYE") {
    reply200(m);
    const why = reasonText(m);
    teardown(false);
    if (why === "banned") return showBanned();
    if (why === "yellow-card") { me.cards = (me.cards || 0) + 1; return setIdle("bad", T.yellowTitle, T.yellowHint); }
    if (why === "time-limit") return setIdle("", T.timeUp, T.timeUpHint);
    setIdle("bad", T.stationHung, T.retry);
  } else if (m.method === "OPTIONS") reply200(m);
}

function onStation(state, reason) {
  if (state === "talking") {
    call.state = "talking"; marker = true;
    talkStart = Date.now(); clearInterval(talkTimer);
    talkTimer = setInterval(tick, 1000);
    lcd("talk", T.onLine, "00:00");
    handset.classList.remove("ring"); void handset.offsetWidth; handset.classList.add("ring");
  } else if (state === "searching") {
    if (call.state === "talking") lastTalkEnd = Date.now();
    call.state = "searching"; clearInterval(talkTimer);
    const text = { "peer-left": T.peerLeft, "report-accepted": T.reportAccepted, "time-limit": T.timeUp }[reason];
    lcd("search", text || T.searching, text ? T.afterHint : T.ringHint);
  }
  syncReport();
}
function tick() {
  const s = Math.floor((Date.now() - talkStart) / 1000);
  sub.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  syncReport();
}

function openMedia(path) {
  const base = location.href.replace(/[^/]*$/, "").replace(/^http/, "ws");
  mediaWS = new WebSocket(base + path);
  mediaWS.binaryType = "arraybuffer";
  mediaWS.onmessage = e => onRTP(e.data);
}

async function pickUp() {
  if (!termsOk) {
    termsOk = true;
    try { localStorage.setItem("kontakt-terms", TERMS_VERSION); } catch {}
    gate.hidden = true;
    scene.classList.remove("entry");
  }
  if (tokens.n === 0) { denied(); return setIdle(); }
  if (!window.isSecureContext) return setIdle("bad", T.needHttps, T.needHttpsHint);
  lift(true);
  showButtons("call");
  lcd("search", T.pickingUp, T.allowMic);
  try { await startAudio(); }
  catch { return setIdle("bad", T.noMic, T.noMicHint); }

  call.state = "dialing";
  call.id = rnd(10); call.fromTag = rnd(4); call.cseq = 1; call.toTag = null;
  call.ruri = `sip:${LINE}@kontakt`;
  rtpSeq = crypto.getRandomValues(new Uint16Array(1))[0];
  rtpTs = crypto.getRandomValues(new Uint32Array(1))[0];
  rtpSsrc = crypto.getRandomValues(new Uint32Array(1))[0];
  syncReport();

  ws = new WebSocket(location.href.replace(/[^/]*$/, "").replace(/^http/, "ws") + "sip", "sip");
  ws.onopen = () => {
    const sdp = "v=0\r\no=- " + Date.now() + " 1 IN IP4 0.0.0.0\r\ns=Kontakt\r\nc=IN IP4 0.0.0.0\r\nt=0 0\r\n" +
      "m=audio 9 RTP/AVP 8\r\na=rtpmap:8 PCMA/8000\r\na=ptime:20\r\na=sendrecv\r\n";
    sendRaw(build(`INVITE ${call.ruri} SIP/2.0`, [...hdrs("INVITE", 1), `Contact: <sip:anon@${host};transport=ws>`,
      "Content-Type: application/sdp"], sdp));
  };
  ws.onmessage = e => typeof e.data === "string" && onSIP(e.data);
  ws.onclose = () => { if (call.state !== "idle") { teardown(false); setIdle("bad", T.lost, T.lostHint); } };
}

function teardown(sendBye) {
  if (sendBye && call.toTag) sendRaw(build(`BYE ${call.ruri} SIP/2.0`, hdrs("BYE", ++call.cseq, call.toTag)));
  call.state = "idle";
  clearInterval(talkTimer);
  stopAudio();
  const s = ws, m = mediaWS; ws = mediaWS = null;
  if (s) { s.onclose = null; setTimeout(() => s.close(), 100); }
  if (m) m.close();
}

// ---------- жалоба: два нажатия ----------
let armTimer = 0;
function syncReport() {
  const canReport = call.state === "talking" ||
    (call.state === "searching" && lastTalkEnd && Date.now() - lastTalkEnd < cfg.report_window_sec * 1000);
  reportBtn.disabled = !canReport;
}
reportBtn.onclick = async () => {
  if (!reportBtn.classList.contains("armed")) {
    reportBtn.classList.add("armed");
    reportLabel.textContent = T.sure;
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { reportBtn.classList.remove("armed"); reportLabel.textContent = T.ban; }, 3000);
    return;
  }
  clearTimeout(armTimer);
  reportBtn.classList.remove("armed"); reportLabel.textContent = T.ban;
  const r = await sendInfo({ report: true });
  const text = T.report[r && r.result] || T.reportFail;
  lastTalkEnd = 0; syncReport();
  setTimeout(() => { if (call.state === "searching") sub.textContent = text; }, 50);
};

mainBtn.onclick = pickUp;
hangupBtn.onclick = () => {
  const paid = call.state === "talking" && tokens.n > 0; // положил посреди разговора — жетон
  teardown(true);
  if (paid) {
    tokens.n--;
    if (tokens.n === tokens.max - 1) { tokens.next = cfg.token_refill_sec || 120; tokens.at = Date.now(); }
  }
  setIdle(...(paid && tokens.n > 0 ? ["", T.idle, T.tokensLeft(tokens.n, tokens.max)] : []));
  setTimeout(hookClack, 250);
  if (paid) { spendAnim(); setTimeout(() => refreshTokens(false), 1500); }
};
initButtons();
window.addEventListener("pagehide", () => teardown(true));

loadState(); pollStats(); setInterval(pollStats, 5000);
</script>
